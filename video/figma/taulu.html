<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<!--
  Figma-kohtauksen taulu. Kuvat ovat Figma-tiedoston kehysten
  renderöintejä (scripts/video.mjs hakee ne Figman rajapinnasta, kun
  FIGMA_ACCESS_TOKEN on saatavilla). Taulu asettaa ne riviin kuten
  Figman kanvaasilla, kehyksen nimi yläpuolella.
-->
<link rel="stylesheet" href="/styles/tokens.css" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #F1F1EF; font-family: 'Archivo', Helvetica, Arial, sans-serif;
    display: flex; align-items: flex-start; justify-content: center; gap: 40px;
    /* Yläreunat samalla korkeudella, jotta kamera liukuu vaakasuoraan.
       Reunoilla on tilaa, jotta kamera ehtii keskittää myös
       uloimmat kehykset. */
    box-sizing: border-box; padding-top: 176px;
  }
  figure { margin: 0; }
  figcaption { font-size: 11px; color: #6A6C6E; margin: 0 0 8px; letter-spacing: 0.01em; }
  img { display: block; height: auto; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
  /* Kameran kohdealueet kehyksen sisällä, prosentteina kuvasta. */
  figure > div { position: relative; }
  .alue { position: absolute; pointer-events: none; }
</style>
</head>
<body>
  <figure id="vari"><figcaption>Väri</figcaption><div>
    <img src="vari.png" width="440" />
    <i class="alue" id="vari-muuttujat" style="left: 6%; top: 5%; width: 88%; height: 37%"></i>
  </div></figure>
  <figure id="button"><figcaption>Button</figcaption><div>
    <img src="button.png" width="340" />
    <i class="alue" id="button-variantit" style="left: 0; top: 0; width: 100%; height: 50%"></i>
  </div></figure>
  <figure id="dokumentaatio"><figcaption>Button — dokumentaatio</figcaption><div>
    <img src="button-dokumentaatio.png" width="270" />
    <i class="alue" id="dokumentaatio-koodissa" style="left: 7%; top: 3.5%; width: 86%; height: 24%"></i>
  </div></figure>
</body>
</html>
