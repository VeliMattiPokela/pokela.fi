<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<!--
  Videon sommittelu. scripts/video.mjs avaa tämän sivun, antaa sille
  aikajanan (piirra.alusta) ja ottaa ruudun jokaisella hetkellä
  (piirra.ruutu). Sivu ei animoi itse mitään: kaikki on ajan funktio,
  joten sama aikajana tuottaa aina saman videon.

  Värit, fontit ja välit tulevat sivuston tokeneista.
-->
<link rel="stylesheet" href="/styles/tokens.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Archivo:wght@400;500;600&display=block"
  rel="stylesheet"
/>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: var(--paper-alt); color: var(--ink); font-family: var(--font-ui); }

  .teksti { position: absolute; left: 96px; top: 0; bottom: 0; width: 400px; }
  .tunniste {
    position: absolute; top: 134px; left: 0;
    font-size: 13px; letter-spacing: var(--tr-meta); text-transform: uppercase;
    font-weight: var(--weight-500); color: var(--ink-muted); white-space: pre;
  }
  .otsikko {
    position: absolute; top: 190px; left: 0; width: 400px; margin: 0;
    font-family: var(--font-display); font-weight: var(--weight-500);
    font-size: 52px; line-height: 1.08; letter-spacing: var(--tr-display-xl);
    /* Pienen optisen koon Bodoni on tasaisempi: ohuet viivat eivät
       katoa videon pakkauksessa ja skaalauksessa. */
    font-variation-settings: 'opsz' 11;
  }
  .merkki {
    position: absolute; bottom: 134px; left: 0;
    font-family: var(--font-display); font-size: 22px; color: var(--ink-muted);
  }

  .ikkuna {
    position: absolute; left: 584px; top: 134px; width: 1240px;
    background: var(--paper); border: var(--hairline) solid var(--line);
    box-shadow: 0 32px 80px -24px rgb(0 0 0 / 0.14), 0 2px 6px rgb(0 0 0 / 0.04);
  }
  .palkki {
    height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 16px;
    border-bottom: var(--hairline) solid var(--line);
    font-size: 13px; color: var(--ink-muted);
  }
  .palkki i { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); opacity: 0.6; }
  .palkki span { margin-left: 12px; }
  .nakyma { position: relative; width: 1240px; height: 775px; overflow: hidden; }
  .nakyma img {
    position: absolute; left: 0; top: 0; width: 1440px; height: 900px;
    transform-origin: 0 0; opacity: 0;
  }

  /* Väliotsikkokortti: avaus ja lopetus ilman ikkunaa. */
  .kortti { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; padding: 0 96px 0 584px; }
  .kortti .tunniste { position: static; margin-bottom: 32px; }
  .kortti h1 {
    margin: 0; max-width: 1100px;
    font-family: var(--font-display); font-weight: var(--weight-400);
    font-size: 112px; line-height: 1.05; letter-spacing: var(--tr-display-xl);
    font-variation-settings: 'opsz' 24;
  }
  .kortti p { margin: 40px 0 0; max-width: 640px; font-size: 22px; line-height: 1.5; color: var(--ink-muted); }
  body.on-kortti .kortti { display: flex; }
  body.on-kortti .ikkuna, body.on-kortti .teksti > :not(.merkki) { display: none; }

  /* Vaihepolku: koko videon ajan näkyvä aikajana, joka kertoo, missä
     kohtaa prosessia ollaan. Täyttyy kohtaus kohtaukselta, joten
     kohtausten leikkauksissa se jatkuu katkeamatta. */
  .nauha {
    position: absolute; left: 0; right: 0; top: 984px; bottom: 0;
    background: var(--badge-surface); border-top: var(--hairline) solid var(--line);
  }
  .polku { position: absolute; left: 96px; right: 96px; top: 1020px; display: flex; }
  .polku .rata { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--ink-faint); opacity: 0.35; }
  .polku .taytto { position: absolute; left: 0; top: 0; height: 1px; background: var(--ink); }
  .polku .paa {
    position: absolute; top: 0; width: 9px; height: 9px; margin: -4px 0 0 -4px;
    border-radius: 50%; background: var(--ink);
  }
  .polku .askel { position: relative; flex: 1; padding-top: 18px; }
  .polku .askel::before {
    content: ''; position: absolute; left: 0; top: -2px; width: 5px; height: 5px;
    border-radius: 50%; background: var(--badge-surface); border: 1px solid var(--line-strong);
  }
  .polku .askel.ohi::before { background: var(--ink); border-color: var(--ink); }
  .polku .nro {
    font-size: 11px; letter-spacing: var(--tr-meta); font-weight: var(--weight-500);
    color: var(--ink-faint); margin-right: 10px;
  }
  .polku .nimi { font-size: 14px; color: var(--ink-faint); }
  .polku .askel.ohi .nimi { color: var(--ink-muted); }
  .polku .askel.nyt .nro, .polku .askel.nyt .nimi { color: var(--ink); }
  .polku .askel.nyt .nimi { font-weight: var(--weight-500); }

  .kursori { position: absolute; left: 0; top: 0; width: 26px; height: 26px; transform-origin: 3px 2px; }
  .rengas {
    position: absolute; left: 0; top: 0; width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border-radius: 50%; border: 2px solid var(--ink); opacity: 0;
  }
</style>
</head>
<body>
  <div class="teksti">
    <div class="tunniste" id="tunniste"></div>
    <h1 class="otsikko" id="otsikkoA"></h1>
    <h1 class="otsikko" id="otsikkoB"></h1>
    <div class="merkki">pokela.fi</div>
  </div>
  <div class="kortti" id="kortti">
    <div class="tunniste" id="korttiTunniste"></div>
    <h1 id="korttiOtsikko"></h1>
    <p id="korttiTeksti"></p>
  </div>
  <div class="ikkuna" id="ikkuna">
    <div class="palkki"><i></i><i></i><i></i><span id="osoite"></span></div>
    <div class="nakyma" id="nakyma">
      <div class="rengas" id="rengas"></div>
      <svg class="kursori" id="kursori" viewBox="0 0 26 26">
        <path d="M3 2 L3 21 L8 16.5 L11.5 24 L15 22.5 L11.5 15 L18 15 Z"
              fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <div class="nauha" id="nauha"></div>
  <div class="polku" id="polku"><div class="rata"></div><div class="taytto" id="taytto"></div><div class="paa" id="paa"></div></div>

<script>
  /* Näkymän leveys / tallennuksen leveys (1440 CSS-pikseliä). */
  const NAKYMA = { w: 1240, h: 775 };
  const S0 = NAKYMA.w / 1440;

  const pehmea = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const ulos = (x) => 1 - Math.pow(1 - x, 3);
  const rajaa = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const valilla = (t, a, b) => rajaa((t - a) / (b - a));
  const lerp = (a, b, k) => a + (b - a) * k;

  let A; // aikajana
  const kuvat = [];

  /* Avainkehysten arvo hetkellä t. Jokainen kehys on {t0, t1, ...arvot}:
     arvo liukuu edellisestä tähän välillä t0–t1. */
  function avain(kehykset, t, kentat, kayra = pehmea) {
    let nyt = { ...kehykset[0] };
    for (const k of kehykset.slice(1)) {
      if (t <= k.t0) break;
      const p = kayra(valilla(t, k.t0, k.t1));
      const uusi = {};
      for (const f of kentat) uusi[f] = lerp(nyt[f], k[f], p);
      nyt = { ...nyt, ...uusi };
      if (t < k.t1) break;
    }
    return nyt;
  }

  /* Kortti: tunniste, otsikko ja teksti nousevat porrastetusti. */
  function kortti(t) {
    const pois = 1 - valilla(t, A.kesto - 0.6, A.kesto);
    [['korttiTunniste', 0.1], ['korttiOtsikko', 0.3], ['korttiTeksti', 0.7]].forEach(([id, alku]) => {
      /* Videon ensimmäinen kortti on valmiina heti ensimmäisessä
         ruudussa: siitä tulee sivun julistekuva ja jaon esikatselu. */
      const p = A.kortti.alussa ? 1 : ulos(valilla(t, alku, alku + 1.0));
      const e = document.getElementById(id);
      e.style.opacity = p * pois;
      e.style.transform = `translateY(${(1 - p) * 18}px)`;
    });
  }

  /* Vaihepolku etenee tasaisesti kohtauksen läpi. Avauskortin lopussa
     polku ilmestyy tyhjänä, lopetuskortissa se on täynnä ja häipyy. */
  function vaihepolku(t) {
    const { vaiheet, i } = A.polku;
    const n = vaiheet.length;
    const polku = document.getElementById('polku');
    let edistys, nakyvyys = 1;
    if (i < 0) {
      edistys = 0;
      nakyvyys = ulos(valilla(t, A.kesto - 1.4, A.kesto - 0.4));
    } else if (i >= n) {
      edistys = 1;
      nakyvyys = 1 - valilla(t, A.kesto - 0.6, A.kesto);
    } else {
      edistys = (i + rajaa(t / A.kesto)) / n;
    }
    polku.style.opacity = nakyvyys;
    document.getElementById('nauha').style.opacity = nakyvyys;
    document.getElementById('taytto').style.width = `${edistys * 100}%`;
    const paa = document.getElementById('paa');
    paa.style.left = `${edistys * 100}%`;
    paa.style.opacity = i >= 0 && i < n ? 1 : 0;
    polku.querySelectorAll('.askel').forEach((e, j) => {
      e.classList.toggle('ohi', j < i || (j === i && i < n));
      e.classList.toggle('nyt', j === i);
    });
  }

  window.piirra = {
    async alusta(aikajana) {
      A = aikajana;
      document.getElementById('tunniste').textContent = A.tunniste;
      document.getElementById('osoite').textContent = A.osoiteteksti ?? '';
      if (A.kortti) {
        document.body.classList.add('on-kortti');
        document.getElementById('korttiTunniste').textContent = A.tunniste;
        document.getElementById('korttiOtsikko').textContent = A.otsikot[0].teksti;
        document.getElementById('korttiTeksti').textContent = A.kortti.teksti ?? '';
      }
      const nakyma = document.getElementById('nakyma');
      for (const k of A.kuvat) {
        const img = new Image();
        img.src = k.src;
        await img.decode();
        nakyma.insertBefore(img, document.getElementById('rengas'));
        kuvat.push({ ...k, img });
      }
      const polku = document.getElementById('polku');
      for (const v of A.polku.vaiheet) {
        const e = document.createElement('div');
        e.className = 'askel';
        e.innerHTML = `<span class="nro"></span><span class="nimi"></span>`;
        e.children[0].textContent = v.nro;
        e.children[1].textContent = v.nimi;
        polku.appendChild(e);
      }
      await document.fonts.ready;
    },

    ruutu(t) {
      vaihepolku(t);
      if (A.kortti) return kortti(t);
      /* Sisääntulo ja poistuminen. */
      const sisaan = ulos(valilla(t, 0, 0.9));
      const pois = 1 - valilla(t, A.kesto - 0.6, A.kesto);
      const ikkuna = document.getElementById('ikkuna');
      ikkuna.style.opacity = sisaan * pois;
      ikkuna.style.transform = `translateY(${(1 - sisaan) * 24}px)`;
      document.getElementById('tunniste').style.opacity = ulos(valilla(t, 0.1, 0.8)) * pois;

      /* Otsikot: vaihtuva otsikko ristihäivytetään. */
      const [a, b] = ['otsikkoA', 'otsikkoB'].map((id) => document.getElementById(id));
      let i = 0;
      A.otsikot.forEach((o, j) => { if (t >= o.t) i = j; });
      const nyt = A.otsikot[i], ed = A.otsikot[i - 1];
      const vaihto = i === 0 ? ulos(valilla(t, 0.2, 1.0)) : ulos(valilla(t, nyt.t + 0.25, nyt.t + 0.95));
      a.textContent = nyt.teksti;
      a.style.opacity = vaihto * pois;
      a.style.transform = `translateY(${(1 - vaihto) * 14}px)`;
      b.textContent = ed ? ed.teksti : '';
      b.style.opacity = ed ? (1 - valilla(t, nyt.t, nyt.t + 0.3)) * pois : 0;

      /* Kamera. */
      const k = avain(A.kamera, t, ['x', 'y', 'zoom', 'vy']);
      const s = S0 * k.zoom;
      const tx = NAKYMA.w / 2 - k.x * s;
      const ty = NAKYMA.h / 2 - k.y * s;
      for (const kuva of kuvat) {
        kuva.img.style.transform = `translate(${tx}px, ${ty + (kuva.y - k.vy) * s}px) scale(${s})`;
        kuva.img.style.opacity = rajaa((t - kuva.t0) / 0.14) * (kuva.t1 == null ? 1 : 1 - rajaa((t - kuva.t1) / 0.14));
      }

      /* Osoitin: liike kevyesti kaarevaa rataa pitkin. */
      const kursori = document.getElementById('kursori');
      const rengas = document.getElementById('rengas');
      let paikka = { ...A.kursori[0] };
      let painallus = null;
      for (const m of A.kursori.slice(1)) {
        if (t <= m.t0) break;
        const p = pehmea(valilla(t, m.t0, m.t1));
        const dx = m.x - paikka.x, dy = m.y - paikka.y;
        const kaari = Math.sin(p * Math.PI) * 0.08;
        paikka = { x: lerp(paikka.x, m.x, p) - dy * kaari, y: lerp(paikka.y, m.y, p) + dx * kaari };
        if (t >= m.t1) paikka = { x: m.x, y: m.y };
        if (m.klikkaus != null && t >= m.klikkaus) painallus = m.klikkaus;
        if (t < m.t1) break;
      }
      const px = (paikka.x - k.x) * s + NAKYMA.w / 2;
      const py = (paikka.y - k.y) * s + NAKYMA.h / 2;
      const koko = 0.9 + 0.25 * Math.sqrt(k.zoom);
      const alas = painallus == null ? 0 : Math.sin(valilla(t, painallus - 0.06, painallus + 0.16) * Math.PI);
      /* Kohtauksessa ilman klikkauksia osoitinta ei näytetä. */
      kursori.style.opacity = A.kursori.length > 1 ? valilla(t, 0.6, 1.0) * pois : 0;
      kursori.style.transform = `translate(${px - 3}px, ${py - 2}px) scale(${koko * (1 - 0.14 * alas)})`;
      const r = painallus == null ? 1 : valilla(t, painallus, painallus + 0.5);
      rengas.style.opacity = (1 - r) * 0.35 * (r > 0 ? 1 : 0);
      rengas.style.transform = `translate(${px}px, ${py}px) scale(${0.3 + 0.7 * ulos(r)})`;
    },
  };
</script>
</body>
</html>
