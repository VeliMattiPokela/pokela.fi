name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uusi push pull requestiin peruu saman PR:n vanhan, kesken olevan
# ajon: sen tulosta ei enää lueta. Mainia ei peruta, koska mainin ajo
# julkaisee (Figma, npm) ja jokaisen yhdistetyn muutoksen pitää tulla
# julkaistuksi.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Synkkatarkistus, tyypit ja build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Storyt ajetaan oikeassa selaimessa, joten Chromium tarvitaan.
      # Binääri on iso (~570 MB), joten se välimuistitetaan
      # lukkotiedoston hashilla — lataus vain kun Playwright päivittyy.
      - name: Selainvälimuisti
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Asenna Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      # Kuvaputken johdannaiset (AVIF ja video) veivät noin neljä
      # minuuttia jokaisesta ajosta, vaikka lähteet eivät muuttuneet.
      # kuvat.mjs tallentaa ne avaimella, joka lasketaan lähteestä ja
      # asetuksista, joten vanhakin välimuisti on turvallinen: muuttunut
      # kuva lasketaan uudelleen, muut kopioidaan.
      - name: Kuvien välimuisti
        uses: actions/cache@v4
        with:
          path: .kuvavalimuisti
          key: kuvat-${{ hashFiles('kuvat/**', 'content/**', 'scripts/kuvat.mjs', 'package-lock.json') }}
          restore-keys: kuvat-

      # Eriytymä pysäyttää putken ja kertoo MIKÄ eriytyi.
      # Tämä on case 03:n väite käytännössä.
      - name: Tokenit synkassa (tokens.css ↔ tokens.json)
        run: npm run check:tokens

      - name: Storyt kattavat komponentit
        run: npm run check:stories

      # Kytkentä koodin ja Figman välillä: osoittaako se yhä olemassa
      # olevaan komponenttiin ja oikeaan Figma-tiedostoon.
      - name: Code Connect -kytkennät ehjiä
        run: npm run check:code-connect

      # Jokainen kovakoodattu mitta tai väri on joko token tai
      # kirjattu poikkeus syineen — hiljaista poikkeusta ei ole.
      - name: Ei kovakoodattuja arvoja tyyleissä
        run: npm run check:hardcoded

      # public/-kansion favicon lasketaan tokeneista. Binääri repossa
      # ei kerro mistä se on tullut, joten paletin muutos jättäisi
      # ikonin vanhaan sävyyn kenenkään huomaamatta.
      - name: Favicon vastaa tokeneita
        run: npm run check:favicon

      # Kuvamanifesti on johdettu lähteistä ja sisällön kuvasuhteista.
      # Tarkistus laskee sen uudelleen ja vertaa — se huomaa myös
      # lähteen jolle ei ole paikkaa sisällössä.
      - name: Kuvat vastaavat sisältöä
        run: npm run check:kuvat

      # Sama kuvasuhde on kahdessa elävässä paikassa: kuvat.mjs rajaa
      # kuvan levylle, base.css piirtää sen selaimeen. Jos ne eroavat,
      # kuva rajataan yhteen muotoon ja näytetään toisessa — mikään ei
      # kaadu, virhe näkyy vain silmällä ja vain oikealla leveydellä.
      - name: Kuvasuhteet synkassa (rajaus ↔ esitys)
        run: npm run check:suhteet

      # Ketjun viimeinen lenkki: Figma Make lukee npm:ää, ei repoa.
      # Jos julkaistu paketti jää jälkeen, prototyypit tehdään eri
      # komponenteilla kuin sivusto — hiljaa. Tarvitsee verkon, joten
      # ei ole check:sync-ketjussa. Tässä vaiheessa uudempi, vielä
      # julkaisematon versio on oikein: main julkaisee sen lopussa.
      - name: Paketit vastaavat npm:ää
        run: npm run check:paketti -- --ennen-julkaisua

      - name: Dokumentaatio ajan tasalla
        run: npm run check:docs

      # Casesivu sanoo kytkennöistä "julkaistaan repon mukana". Ennen
      # tätä se ei pitänyt paikkaansa: tiedostot olivat repossa mutta
      # Figma ei tiennyt niistä mitään, joten Dev Modessa ei näkynyt
      # koodia. Nyt väite on totta rakenteeltaan.
      #
      # Vain mainiin: pull request ei saa kirjoittaa Figmaan.
      - name: Code Connect Figmaan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run figma:publish
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      - name: Tyypintarkistus
        run: npx tsc --noEmit

      # Jokainen story renderöidään ja tarkistetaan axella.
      # Saavutettavuusvirhe kaataa ajon — a11y: { test: 'error' }.
      - name: Storyt ja saavutettavuus
        run: npm run test:stories

      # npm-paketit tokeneista ja komponenteista. Ei tarvita sivuston
      # buildiin, mutta rakennetaan täällä jotta rikkova muutos
      # huomataan heti eikä vasta julkaisuhetkellä. Komponenttipaketti
      # pysähtyy myös siihen jos vietävä komponentti alkaa tuoda
      # sivustokohtaista (@/content, @/lib, next/*).
      - name: npm-paketit
        run: npm run paketti

      # Sama build kuin Netlifyssä: synkkatarkistukset, kuvat ja videot
      # (johdannaiset lasketaan lähteistä joka buildissa) ja Next.js.
      # scripts/ajo.mjs kirjaa vaiheet ennen Next.js:ää, ja case 03
      # näyttää ne aikajanana. Tarkistukset ajetaan siis toiseen
      # kertaan, mutta ne vievät sekunnin; kuvat vain kerran.
      - name: Sivuston build
        run: node scripts/ajo.mjs

      # Ainoa tarkistus joka avaa Figma-tiedoston. Ei ole
      # check:sync-ketjussa: ketjun pitää toimia ilman verkkoa ja
      # ilman salaisuuksia, eikä Figman katkos saa estää buildia.
      # Buildin jälkeen, koska sivupohjien tekstejä verrataan
      # buildattuun sivuun (out/).
      - name: Koodi ja Figma synkassa
        run: npm run check:figma
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}

      # Sivusto julkaisee omat designtokeninsa osoitteeseen /tokens.json.
      - name: Tokenit mukaan julkaisuun
        run: npm run publish:tokens

      # Rikkinäinen story ei saa päätyä julkaistuun Storybookiin —
      # se on casen todistusaineistoa, ei kehitystyökalu.
      - name: Storybookin build
        run: npm run build-storybook

      # Main julkaisee paketit itse, kun kaikki yllä on vihreää. Ennen
      # tätä julkaisu oli ketjun ainoa käsin tehty askel. Julkaisee vain
      # version, jota npm:ssä ei vielä ole, joten ilman nostoa ei tapahdu
      # mitään. Vain mainiin: pull request ei saa julkaista.
      - name: Paketit npm:ään
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run paketti:julkaise
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Julkaisun jälkeen ilman lippua: npm:n pitää nyt vastata repoa
      # tavulleen.
      - name: Julkaistu paketti vastaa repoa
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run check:paketti
